<script>
document.addEventListener("DOMContentLoaded", function () {
    function initializePeopleCharacterCounters() {
        document.querySelectorAll("[data-people-counter]").forEach(function (field) {
            const counter = document.getElementById(
                field.getAttribute("data-people-counter")
            );

            if (!counter) {
                return;
            }

            const maximum = Number(field.getAttribute("maxlength")) || 0;

            function updateCounter() {
                const current = field.value.length;

                counter.textContent = current + "/" + maximum;

                counter.classList.toggle(
                    "is-near-limit",
                    maximum > 0
                    && current >= maximum * 0.9
                    && current < maximum
                );

                counter.classList.toggle(
                    "is-at-limit",
                    maximum > 0
                    && current >= maximum
                );
            }

            field.addEventListener("input", updateCounter);
            updateCounter();
        });
    }

    function splitPeopleEntries(value) {
        return String(value || "")
            .split(/[,\\r\\n]+/)
            .map(function (entry) {
                return entry.replace(/\\s+/g, " ").trim();
            })
            .filter(Boolean);
    }

    function renderPeopleChips(container, entries) {
        if (!container) {
            return;
        }

        container.innerHTML = "";

        entries.forEach(function (entry) {
            const chip = document.createElement("span");
            chip.className = "pt-profile-chip";
            chip.textContent = entry;
            container.appendChild(chip);
        });
    }

    function getFormValue(form, name) {
        const field = form.elements.namedItem(name);

        if (!field || typeof field.value !== "string") {
            return "";
        }

        return field.value.trim();
    }

    function setPreviewRow(preview, name, hasValue) {
        const row = preview.querySelector(
            '[data-people-preview-row="' + name + '"]'
        );

        if (row) {
            row.hidden = !hasValue;
        }
    }

    function updatePeoplePreview(form, preview) {
        if (!form || !preview) {
            return;
        }

        const name = getFormValue(form, "name");
        const role = getFormValue(form, "role_title");
        const position = getFormValue(form, "school_position");
        const department = getFormValue(form, "institute_department");
        const courses = splitPeopleEntries(
            getFormValue(form, "courses_handled")
        );
        const achievements = splitPeopleEntries(
            getFormValue(form, "achievements")
        );
        const additional = getFormValue(
            form,
            "additional_information"
        );

        const nameTarget = preview.querySelector(
            "[data-people-preview-name]"
        );
        const roleTarget = preview.querySelector(
            "[data-people-preview-role]"
        );
        const positionTarget = preview.querySelector(
            "[data-people-preview-position]"
        );
        const departmentTarget = preview.querySelector(
            "[data-people-preview-department]"
        );
        const additionalTarget = preview.querySelector(
            "[data-people-preview-additional]"
        );

        if (nameTarget) {
            nameTarget.textContent = name || "Profile Name";
        }

        if (roleTarget) {
            roleTarget.textContent = role;
            roleTarget.hidden = !role;
        }

        if (positionTarget) {
            positionTarget.textContent = position;
        }

        if (departmentTarget) {
            departmentTarget.textContent = department;
        }

        if (additionalTarget) {
            additionalTarget.textContent = additional;
        }

        setPreviewRow(preview, "school_position", Boolean(position));
        setPreviewRow(preview, "institute_department", Boolean(department));
        setPreviewRow(preview, "courses_handled", courses.length > 0);
        setPreviewRow(preview, "achievements", achievements.length > 0);
        setPreviewRow(preview, "additional_information", Boolean(additional));

        renderPeopleChips(
            preview.querySelector("[data-people-preview-courses]"),
            courses
        );

        renderPeopleChips(
            preview.querySelector("[data-people-preview-achievements]"),
            achievements
        );

        const placeholder = preview.querySelector(
            "[data-people-preview-placeholder]"
        );

        if (placeholder) {
            placeholder.textContent = (
                name ? name.slice(0, 1).toUpperCase() : "?"
            );
        }

        document.querySelectorAll(
            "[data-people-entry-feedback]"
        ).forEach(function (container) {
            const fieldName = container.getAttribute(
                "data-people-entry-feedback"
            );

            const entries = splitPeopleEntries(
                getFormValue(form, fieldName)
            );

            renderPeopleChips(container, entries);
        });
    }

    function initializePeopleLivePreview() {
        const form = document.querySelector("[data-people-profile-form]");
        const preview = document.querySelector("[data-people-live-preview]");

        if (!form || !preview) {
            return;
        }

        const imageInput = form.elements.namedItem("image");
        const removeImageInput = form.elements.namedItem("remove_image");
        const previewImage = preview.querySelector("[data-people-preview-image]");
        const previewPlaceholder = preview.querySelector("[data-people-preview-placeholder]");
        const cropper = form.querySelector("[data-people-image-cropper]");
        const cropViewport = cropper && cropper.querySelector("[data-people-crop-viewport]");
        const cropImage = cropper && cropper.querySelector("[data-people-crop-image]");
        const cropEmpty = cropper && cropper.querySelector("[data-people-crop-empty]");
        const xField = form.elements.namedItem("image_position_x");
        const yField = form.elements.namedItem("image_position_y");
        const scaleField = form.elements.namedItem("image_scale");
        const xRange = cropper && cropper.querySelector("[data-people-crop-x]");
        const yRange = cropper && cropper.querySelector("[data-people-crop-y]");
        const scaleRange = cropper && cropper.querySelector("[data-people-crop-scale]");
        const scaleValue = cropper && cropper.querySelector("[data-people-crop-scale-value]");
        const resetButton = cropper && cropper.querySelector("[data-people-crop-reset]");
        const positionLabel = cropper && cropper.querySelector("[data-people-crop-position]");

        let currentX = clampPosition(xField && xField.value, 50);
        let currentY = clampPosition(yField && yField.value, 50);
        let currentScale = clampScale(scaleField && scaleField.value, 100);
        let initialX = currentX;
        let initialY = currentY;
        let initialScale = currentScale;
        let currentObjectUrl = "";
        let activeDrag = null;

        function clampPosition(value, fallback) {
            const parsed = Number.parseFloat(value);
            return Number.isFinite(parsed)
                ? Math.round(Math.min(100, Math.max(0, parsed)))
                : fallback;
        }

        function clampScale(value, fallback) {
            const parsed = Number.parseFloat(value);
            return Number.isFinite(parsed)
                ? Math.round(Math.min(250, Math.max(100, parsed)))
                : fallback;
        }

        function showPeopleImagePlaceholder() {
            if (previewImage) previewImage.hidden = true;
            if (previewPlaceholder) previewPlaceholder.hidden = false;
        }

        function applyPosition() {
            currentX = clampPosition(currentX, 50);
            currentY = clampPosition(currentY, 50);
            currentScale = clampScale(currentScale, 100);
            const objectPosition = currentX + "% " + currentY + "%";
            const transform = "scale(" + (currentScale / 100) + ")";
            const transformOrigin = currentX + "% " + currentY + "%";

            if (xField) xField.value = String(currentX);
            if (yField) yField.value = String(currentY);
            if (scaleField) scaleField.value = String(currentScale);
            if (xRange) xRange.value = String(currentX);
            if (yRange) yRange.value = String(currentY);
            if (scaleRange) scaleRange.value = String(currentScale);
            if (scaleValue) scaleValue.textContent = currentScale + "%";
            if (positionLabel) {
                positionLabel.textContent = "Horizontal " + currentX + "% · Vertical " + currentY + "% · Scale " + currentScale + "%";
            }
            [cropImage, previewImage].forEach(function (image) {
                if (!image) return;
                image.style.objectPosition = objectPosition;
                image.style.transform = transform;
                image.style.transformOrigin = transformOrigin;
            });
        }

        function showCropImage(source) {
            if (!cropImage || !cropEmpty) return;
            if (source) {
                cropImage.onload = function () {
                    cropImage.hidden = false;
                    cropEmpty.hidden = true;
                    applyPosition();
                };
                cropImage.onerror = function () {
                    cropImage.hidden = true;
                    cropEmpty.hidden = false;
                };
                cropImage.src = source;
                if (cropImage.complete && cropImage.naturalWidth > 0) {
                    cropImage.hidden = false;
                    cropEmpty.hidden = true;
                    applyPosition();
                }
            } else {
                cropImage.hidden = true;
                cropEmpty.hidden = false;
            }
        }

        function showPreviewImage(source) {
            if (!previewImage || !previewPlaceholder) return;
            if (source) {
                previewImage.src = source;
                previewImage.alt = getFormValue(form, "name") || "Profile image preview";
                previewImage.hidden = false;
                previewPlaceholder.hidden = true;
                applyPosition();
            } else {
                showPeopleImagePlaceholder();
            }
        }

        function restoreOriginalImage() {
            const source = cropImage && (
                cropImage.getAttribute("data-original-src") || ""
            );
            currentX = initialX;
            currentY = initialY;
            currentScale = initialScale;
            applyPosition();
            showCropImage(source);
            showPreviewImage(source);
        }

        function syncSelectedImage() {
            if (removeImageInput && removeImageInput.checked) {
                if (imageInput) imageInput.value = "";
                showCropImage("");
                showPreviewImage("");
                return;
            }

            const file = imageInput && imageInput.files && imageInput.files.length
                ? imageInput.files[0]
                : null;

            if (!file) {
                restoreOriginalImage();
                return;
            }

            if (!file.type || !file.type.startsWith("image/")) {
                if (imageInput) imageInput.value = "";
                restoreOriginalImage();
                return;
            }

            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = URL.createObjectURL(file);
            currentX = 50;
            currentY = 50;
            currentScale = 100;
            applyPosition();
            showCropImage(currentObjectUrl);
            showPreviewImage(currentObjectUrl);
        }

        function updatePositionFromPointer(event) {
            if (!activeDrag || !cropImage || !cropViewport) return;
            const rect = cropViewport.getBoundingClientRect();
            const naturalWidth = cropImage.naturalWidth;
            const naturalHeight = cropImage.naturalHeight;
            if (!naturalWidth || !naturalHeight) return;

            const scale = Math.max(rect.width / naturalWidth, rect.height / naturalHeight);
            const zoom = currentScale / 100;
            const overflowX = Math.max(0, naturalWidth * scale * zoom - rect.width);
            const overflowY = Math.max(0, naturalHeight * scale * zoom - rect.height);
            const deltaX = event.clientX - activeDrag.pointerX;
            const deltaY = event.clientY - activeDrag.pointerY;

            currentX = overflowX > 0
                ? activeDrag.positionX - (deltaX / overflowX) * 100
                : activeDrag.positionX;
            currentY = overflowY > 0
                ? activeDrag.positionY - (deltaY / overflowY) * 100
                : activeDrag.positionY;
            applyPosition();
        }

        if (cropViewport && cropImage) {
            cropViewport.addEventListener("pointerdown", function (event) {
                if (cropImage.hidden || !cropImage.naturalWidth) return;
                activeDrag = {
                    pointerId: event.pointerId,
                    pointerX: event.clientX,
                    pointerY: event.clientY,
                    positionX: currentX,
                    positionY: currentY,
                };
                cropViewport.setPointerCapture(event.pointerId);
                cropViewport.classList.add("is-dragging");
                event.preventDefault();
            });

            cropViewport.addEventListener("pointermove", updatePositionFromPointer);
            function endCropDrag(event) {
                if (!activeDrag || activeDrag.pointerId !== event.pointerId) return;
                activeDrag = null;
                cropViewport.classList.remove("is-dragging");
            }
            cropViewport.addEventListener("pointerup", endCropDrag);
            cropViewport.addEventListener("pointercancel", endCropDrag);
            cropViewport.addEventListener("lostpointercapture", function () {
                activeDrag = null;
                cropViewport.classList.remove("is-dragging");
            });
            cropViewport.addEventListener("keydown", function (event) {
                const step = event.shiftKey ? 10 : 2;
                if (event.key === "ArrowLeft") currentX -= step;
                else if (event.key === "ArrowRight") currentX += step;
                else if (event.key === "ArrowUp") currentY -= step;
                else if (event.key === "ArrowDown") currentY += step;
                else return;
                event.preventDefault();
                applyPosition();
            });
        }

        if (xRange) {
            xRange.addEventListener("input", function () {
                currentX = clampPosition(xRange.value, 50);
                applyPosition();
            });
        }
        if (yRange) {
            yRange.addEventListener("input", function () {
                currentY = clampPosition(yRange.value, 50);
                applyPosition();
            });
        }
        if (scaleRange) {
            scaleRange.addEventListener("input", function () {
                currentScale = clampScale(scaleRange.value, 100);
                applyPosition();
            });
        }
        if (resetButton) {
            resetButton.addEventListener("click", function () {
                currentX = 50;
                currentY = 50;
                currentScale = 100;
                applyPosition();
            });
        }

        if (imageInput) {
            imageInput.addEventListener("change", function () {
                const hasReplacement = imageInput.files && imageInput.files.length;
                if (hasReplacement && removeImageInput) removeImageInput.checked = false;
                syncSelectedImage();
            });
        }
        if (removeImageInput) {
            removeImageInput.addEventListener("change", syncSelectedImage);
        }

        form.addEventListener("input", function () {
            updatePeoplePreview(form, preview);
        });
        form.addEventListener("change", function () {
            updatePeoplePreview(form, preview);
        });

        updatePeoplePreview(form, preview);
        applyPosition();
        restoreOriginalImage();

        form.addEventListener("submit", function () {
            // Keep the final hidden values synchronized with the last drag/slider position.
            applyPosition();
        });

        window.addEventListener("pagehide", function () {
            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        }, { once: true });
    }

    initializePeopleCharacterCounters();
    initializePeopleLivePreview();
});
</script>
