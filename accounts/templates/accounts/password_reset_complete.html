{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset Complete | The Equalizer</title>

<style>
    .security-page {
        width: min(620px, calc(100% - 28px));
        margin: 48px auto;
        padding: 30px;
        border: 1px solid #dce4df;
        border-top: 4px solid #c9a227;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(14,42,34,.08);
        color: #17231f;
        font-family: Arial, sans-serif;
    }
    .security-page h1 {
        margin: 0 0 10px;
        color: #0e2a22;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 34px;
    }
    .security-page p { color:#66736d; line-height:1.65; }
    .security-page form p { margin: 16px 0; }
    .security-page label { display:block; margin-bottom:6px; font-weight:700; color:#173f32; }
    .security-page input {
        width:100%; box-sizing:border-box; min-height:44px;
        padding:10px 12px; border:1px solid #cbd7d1; border-radius:8px;
    }
    .security-page .errorlist { color:#b42318; padding-left:20px; }
    .security-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
    .security-button {
        display:inline-flex; align-items:center; justify-content:center;
        min-height:42px; padding:9px 15px; border-radius:999px;
        border:1px solid #173f32; background:#173f32; color:#fff;
        font-weight:800; text-decoration:none; cursor:pointer;
    }
    .security-button.secondary { background:#fff; color:#173f32; }
</style>

</head>
<body style="margin:0;background:#f4f7f5;">

<main class="security-page">
    <h1>Password updated</h1>
    <p>
        Your password has been changed successfully. You can now sign in with
        the new password.
    </p>
    <div class="security-actions">
        <a class="security-button" href="{% url 'login' %}">
            Sign In
        </a>
    </div>
</main>

</body>
</html>
