{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            The Equalizer
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

    <header>
        <h1>The Equalizer</h1>

        <nav>
            <a href="{% url 'home' %}">Home</a>

            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">
                    Dashboard
                </a>

                <a href="{% url 'logout' %}">
                    Logout
                </a>
            {% else %}
                <a href="{% url 'login' %}">
                    Staff Login
                </a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
